name: Mirror source repository

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mirror-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy source repository exactly
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/nhattruc512-hub/chamcongca-971relax.git /tmp/source
          rsync -a --exclude '.git' /tmp/source/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to mirror"
            exit 0
          fi
          git commit -m "Mirror chamcongca-971relax"
          git push origin HEAD:main
